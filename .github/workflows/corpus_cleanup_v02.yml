# Historical cleanup is retired: frozen prompts must never be rewritten by CI.
name: Verify frozen corpus (legacy cleanup entry point)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/validate_prompt_corpus.py
      - run: python scripts/validate_pilot_annotations.py
