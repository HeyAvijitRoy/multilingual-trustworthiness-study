name: Validate RIU annotations

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/annotations/**'
      - 'scripts/validate_pilot_annotations.py'
      - '.github/workflows/validate_annotations.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate pilot annotations
        run: python scripts/validate_pilot_annotations.py
